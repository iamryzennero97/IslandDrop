name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IslandDrop.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: IslandDrop-apk
          path: IslandDrop.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Island Drop build ${{ github.run_number }}
          body: Install IslandDrop.apk on Android (allow "Install unknown apps" when asked).
          files: IslandDrop.apk
